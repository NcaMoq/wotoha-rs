services:
  wotoha:
    image: ghcr.io/ncamoq/wotoha-rs:${WOTOHA_IMAGE_TAG:?set WOTOHA_IMAGE_TAG to an immutable sha-<commit> or version tag}
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN-}
      - WOTOHA_AUTOMIX_PLANNER_MODE=${WOTOHA_AUTOMIX_PLANNER_MODE:-legacy}
      - WOTOHA_AUTOMIX_V2_SHADOW_ENABLED=${WOTOHA_AUTOMIX_V2_SHADOW_ENABLED:-false}
      - WOTOHA_ANALYSIS_CACHE_DIR=/data/cache/analysis
      - WOTOHA_LOG_DIR=/data/logs
      - WOTOHA_DENO_PATH=/app/tools/deno
      - WOTOHA_YTDLP_PATH
    volumes:
      - wotoha-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  wotoha-data:
