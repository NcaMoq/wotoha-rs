name: YouTube worker release

on:
  push:
    tags:
      - "youtube-worker-v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: youtube-worker-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test the worker
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --locked -p wotoha-youtube-js-worker --all-targets -- -D warnings
          cargo build --locked -p wotoha-youtube-js-worker --bin wotoha-youtube-js-worker
      - name: Prepare pinned official EJS oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ejs-reference
          git -C target/ejs-reference init
          git -C target/ejs-reference remote add origin https://github.com/yt-dlp/ejs.git
          git -C target/ejs-reference fetch --depth 1 origin 6f8587bb7009a1fc81038538071d2cb66b8b8ed0
          git -C target/ejs-reference checkout --detach FETCH_HEAD
          npm --prefix target/ejs-reference ci
      - name: Compare current Player with official EJS
        env:
          WOTOHA_YOUTUBE_JS_WORKER: ${{ github.workspace }}/target/debug/wotoha-youtube-js-worker
          WOTOHA_EJS_RUN: ${{ github.workspace }}/target/ejs-reference/run.ts
        run: node scripts/youtube-differential-canary.mjs
      - name: Build the worker
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            ghcr.io/rust-cross/cargo-zigbuild@sha256:b66e2a5063921aca74fc53248d75d187b7499fe1e076d78eb7d87ab1dbc52f6a \
            bash -c 'rustup toolchain install 1.95.0 --profile minimal --target x86_64-unknown-linux-musl && apt-get update && apt-get install -y --no-install-recommends cmake ninja-build && CMAKE_GENERATOR=Ninja cargo +1.95.0 zigbuild --locked --release --bin wotoha-youtube-js-worker --target x86_64-unknown-linux-musl'
      - name: Exercise the exact musl worker artifact
        env:
          WOTOHA_YOUTUBE_JS_WORKER: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/wotoha-youtube-js-worker
        run: |
          node scripts/youtube-worker-smoke.mjs
          cargo test --locked -p wotoha-media providers::youtube::tests::isolated_javascript_worker_round_trips_and_restarts -- --ignored --exact
          cargo test --locked -p wotoha-media providers::youtube::tests::javascript_worker_promotes_content_addressed_candidate -- --ignored --exact
      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          asset="wotoha-youtube-js-worker-x86_64-musl"
          mkdir -p dist
          install -m 0755 \
            target/x86_64-unknown-linux-musl/release/wotoha-youtube-js-worker \
            "dist/$asset"
          digest="$(sha256sum "dist/$asset" | awk '{print $1}')"
          sequence="$(tr -d '\r\n' < deploy/YOUTUBE_WORKER_SEQUENCE)"
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          jq --null-input \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg asset "$asset" \
            --arg digest "$digest" \
            --argjson sequence "$sequence" \
            '{
              schema_version: 1,
              sequence: $sequence,
              tag: $tag,
              commit: $commit,
              protocol_version: 1,
              target: "x86_64-unknown-linux-musl",
              asset: $asset,
              sha256: $digest
            }' > "dist/$asset.manifest.json"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the worker binary
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/${{ steps.assets.outputs.asset }}
      - name: Attest the worker manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/${{ steps.assets.outputs.asset }}.manifest.json
      - name: Download the attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          download_bundle() {
            local subject="$1"
            local destination="$2"
            rm -f sha256*.jsonl
            for attempt in 1 2 3 4 5; do
              if gh attestation download "$subject" --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              (( attempt < 5 ))
              sleep $((attempt * 2))
            done
            local bundle
            bundle="$(find . -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)"
            test -n "$bundle"
            mv "$bundle" "$destination"
          }
          asset="${{ steps.assets.outputs.asset }}"
          download_bundle "$asset" worker.jsonl
          download_bundle "$asset.manifest.json" manifest.jsonl
          cat worker.jsonl manifest.jsonl > "$asset.attestation.jsonl"
          rm -f worker.jsonl manifest.jsonl
      - name: Verify worker attestation policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/${{ steps.assets.outputs.asset }}"
          bundle="$asset.attestation.jsonl"
          gh attestation verify "$asset" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/youtube-worker-release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify "$asset.manifest.json" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/youtube-worker-release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners >/dev/null
          cp "$asset" "$asset.tampered"
          printf x >> "$asset.tampered"
          if gh attestation verify "$asset.tampered" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tampered worker passed attestation verification" >&2
            exit 1
          fi
          rm -f "$asset.tampered"
          cp "$asset.manifest.json" "$asset.manifest.json.tampered"
          printf x >> "$asset.manifest.json.tampered"
          if gh attestation verify "$asset.manifest.json.tampered" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tampered worker manifest passed attestation verification" >&2
            exit 1
          fi
          rm -f "$asset.manifest.json.tampered"
      - name: Publish immutable worker candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/${{ steps.assets.outputs.asset }}"
          gh release create "$GITHUB_REF_NAME" \
            "$asset" \
            "$asset.manifest.json" \
            "$asset.attestation.jsonl" \
            --verify-tag \
            --draft \
            --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
