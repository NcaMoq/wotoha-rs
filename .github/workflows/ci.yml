name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test deployment updater safety
        run: |
          bash -n deploy/*.sh deploy/tests/*.sh
          bash deploy/tests/run.sh
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Lint the application and media provider
        run: cargo clippy --locked -p wotoha-app -p wotoha-media --all-targets -- -D warnings
