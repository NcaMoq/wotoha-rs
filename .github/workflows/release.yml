name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# This workflow runs only for repository tags. GitHub's cache access rules keep
# tag-triggered runs isolated, so release builds intentionally do not restore or
# save Cargo caches. The privileged publish job runs only after both the test
# and musl build jobs succeed.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Test deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/*.sh deploy/tests/*.sh
          bash deploy/tests/run.sh
      - name: Test PowerShell release packager contract
        shell: pwsh
        run: ./deploy/tests/build-ubuntu-musl.Tests.ps1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Lint the application and media provider
        run: cargo clippy --locked -p wotoha-app -p wotoha-media --all-targets -- -D warnings

  ubuntu-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-target-musl"
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$RUNNER_TEMP/cargo-target-musl:/cargo-target" \
            --workdir /work \
            --env CARGO_TARGET_DIR=/cargo-target \
            --env WOTOHA_BUILD_VERSION="$GITHUB_REF_NAME" \
            ghcr.io/rust-cross/cargo-zigbuild@sha256:b66e2a5063921aca74fc53248d75d187b7499fe1e076d78eb7d87ab1dbc52f6a \
            bash -c 'rustup toolchain install 1.95.0 --profile minimal --target x86_64-unknown-linux-musl && apt-get update && apt-get install -y --no-install-recommends cmake jq ninja-build && cargo +1.95.0 install cargo-about --version 0.9.1 --locked --features cli && CMAKE_GENERATOR=Ninja cargo +1.95.0 zigbuild --locked --release --bin wotoha-app --target x86_64-unknown-linux-musl && cargo +1.95.0 metadata --locked --format-version 1 > /cargo-target/cargo-metadata.json && cargo +1.95.0 about generate --frozen --fail --workspace --config deploy/release-about.toml --output-file /cargo-target/THIRD_PARTY_LICENSES.html deploy/third-party-licenses.hbs && bash deploy/generate-cargo-attributions.sh /cargo-target/cargo-metadata.json /cargo-target/THIRD_PARTY_ATTRIBUTIONS.txt'
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/package-release-assets.sh \
            "$RUNNER_TEMP/cargo-target-musl/x86_64-unknown-linux-musl/release/wotoha-app" \
            "$RUNNER_TEMP/cargo-target-musl/cargo-metadata.json" \
            "$RUNNER_TEMP/cargo-target-musl/THIRD_PARTY_LICENSES.html" \
            "$RUNNER_TEMP/cargo-target-musl/THIRD_PARTY_ATTRIBUTIONS.txt" \
            dist
      - name: Upload verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-x86_64-release-inputs
          path: |
            dist/wotoha-ubuntu-x86_64-musl.tar.gz
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.sha256
            dist/wotoha-ubuntu-x86_64-musl.manifest.json
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json
            dist/wotoha-linux-x86_64-musl.tar.gz
            dist/wotoha-linux-x86_64-musl.tar.gz.sha256
            dist/wotoha-linux-x86_64-musl.manifest.json
            dist/wotoha-linux-x86_64-musl.tar.gz.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [test, ubuntu-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ubuntu-x86_64-release-inputs
          path: dist
      - name: Verify downloaded release inputs
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for archive in \
            wotoha-ubuntu-x86_64-musl.tar.gz \
            wotoha-linux-x86_64-musl.tar.gz; do
            sha256sum --check "$archive.sha256"
            digest="$(sha256sum "$archive" | awk '{print $1}')"
            size="$(stat --format=%s "$archive")"
            name="${archive%.tar.gz}"
            cmp --silent "$name.manifest.json" "$archive.manifest.json"
            jq --exit-status \
              --arg tag "$GITHUB_REF_NAME" \
              --arg commit "$GITHUB_SHA" \
              --arg asset "$archive" \
              --arg digest "$digest" \
              --argjson size "$size" \
              '.schema_version == 1
               and .tag == $tag
               and .commit == $commit
               and .asset == $asset
               and .sha256 == $digest
               and .size == $size' \
              "$name.manifest.json" >/dev/null
          done
      - name: Attest updater-compatible archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-ubuntu-x86_64-musl.tar.gz
      - name: Attest updater-compatible manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-ubuntu-x86_64-musl.manifest.json
      - name: Attest updater-compatible manifest alias
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json
      - name: Attest app-only archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-linux-x86_64-musl.tar.gz
      - name: Attest app-only manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-linux-x86_64-musl.manifest.json
      - name: Attest app-only manifest alias
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-linux-x86_64-musl.tar.gz.manifest.json
      - name: Download archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          download_bundle() {
            local subject="$1"
            local destination="$2"
            for attempt in 1 2 3 4 5; do
              rm -f sha256*.jsonl
              if gh attestation download "$subject" --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              (( attempt < 5 ))
              sleep $((attempt * 2))
            done
            local bundle
            bundle="$(find . -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)"
            test -n "$bundle"
            mv "$bundle" "$destination"
          }
          for name in \
            wotoha-ubuntu-x86_64-musl \
            wotoha-linux-x86_64-musl; do
            download_bundle "$name.tar.gz" "$name.archive.jsonl"
            download_bundle "$name.manifest.json" "$name.manifest.jsonl"
            download_bundle "$name.tar.gz.manifest.json" "$name.manifest-alias.jsonl"
            cat "$name.archive.jsonl" "$name.manifest.jsonl" \
              "$name.manifest-alias.jsonl" \
              > "$name.intoto.jsonl"
            cp "$name.intoto.jsonl" "$name.tar.gz.attestation.jsonl"
            rm -f "$name.archive.jsonl" "$name.manifest.jsonl" \
              "$name.manifest-alias.jsonl"
          done
      - name: Verify archive attestation policies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_subject() {
            local subject="$1" bundle="$2"
            gh attestation verify "$subject" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners >/dev/null
          }
          for name in \
            wotoha-ubuntu-x86_64-musl \
            wotoha-linux-x86_64-musl; do
            archive="dist/$name.tar.gz"
            bundle="dist/$name.intoto.jsonl"
            verify_subject "$archive" "$bundle"
            verify_subject "dist/$name.manifest.json" "$bundle"
            verify_subject "$archive.manifest.json" "$bundle"
            cp "$archive" "$archive.tampered"
            printf x >> "$archive.tampered"
            if gh attestation verify "$archive.tampered" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "tampered release archive passed attestation verification" >&2
              exit 1
            fi
            rm -f "$archive.tampered"
            for manifest in \
              "dist/$name.manifest.json" \
              "$archive.manifest.json"; do
              cp "$manifest" "$manifest.tampered"
              printf x >> "$manifest.tampered"
              if gh attestation verify "$manifest.tampered" \
                --bundle "$bundle" \
                --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "tampered release manifest passed attestation verification" >&2
                exit 1
              fi
              rm -f "$manifest.tampered"
            done
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.sha256 \
            dist/wotoha-ubuntu-x86_64-musl.manifest.json \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json \
            dist/wotoha-ubuntu-x86_64-musl.intoto.jsonl \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.attestation.jsonl \
            dist/wotoha-linux-x86_64-musl.tar.gz \
            dist/wotoha-linux-x86_64-musl.tar.gz.sha256 \
            dist/wotoha-linux-x86_64-musl.manifest.json \
            dist/wotoha-linux-x86_64-musl.tar.gz.manifest.json \
            dist/wotoha-linux-x86_64-musl.intoto.jsonl \
            dist/wotoha-linux-x86_64-musl.tar.gz.attestation.jsonl \
            --verify-tag \
            --draft \
            --generate-notes
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
