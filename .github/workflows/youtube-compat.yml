name: YouTube compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: youtube-compatibility
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95.0"
      - name: Test the yt-dlp media provider
        run: cargo test --locked -p wotoha-media
      - name: Verify managed yt-dlp and probe playback
        shell: bash
        run: |
          set -euo pipefail
          source deploy/third-party-versions.env
          curl_retry=(--retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 45 --connect-timeout 10)
          case "$YTDLP_REPOSITORY" in yt-dlp/yt-dlp|yt-dlp/yt-dlp-nightly-builds) ;; *) exit 1 ;; esac
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/$YTDLP_REPOSITORY/releases/download/$YTDLP_VERSION"
          curl -fsSL "${curl_retry[@]}" --max-filesize $((128 * 1024 * 1024)) --remove-on-error "$base/yt-dlp_linux" -o "$tmp/yt-dlp"
          curl -fsSL "${curl_retry[@]}" --max-filesize $((256 * 1024)) --remove-on-error "$base/SHA2-256SUMS" -o "$tmp/SHA2-256SUMS"
          curl -fsSL "${curl_retry[@]}" --max-filesize $((64 * 1024)) --remove-on-error "$base/SHA2-256SUMS.sig" -o "$tmp/SHA2-256SUMS.sig"
          install -d -m 0700 "$tmp/gnupg"
          gpg --batch --homedir "$tmp/gnupg" --import deploy/yt-dlp-public.key
          test "$(gpg --batch --homedir "$tmp/gnupg" --with-colons --fingerprint | awk -F: '$1 == "fpr" {print $10; exit}')" = AC0CBBE6848D6A873464AF4E57CF65933B5A7581
          gpg --batch --homedir "$tmp/gnupg" --verify "$tmp/SHA2-256SUMS.sig" "$tmp/SHA2-256SUMS"
          expected_ytdlp_digest="$(awk '$2 == "yt-dlp_linux" && $1 ~ /^[0-9a-f]{64}$/ {print $1}' "$tmp/SHA2-256SUMS")"
          test "$expected_ytdlp_digest" = "$(sha256sum "$tmp/yt-dlp" | awk '{print $1}')"
          chmod 0755 "$tmp/yt-dlp"
          curl -fsSL "${curl_retry[@]}" --max-filesize $((128 * 1024 * 1024)) --remove-on-error "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip" -o "$tmp/deno.zip"
          printf '%s  %s\n' "$DENO_X86_64_LINUX_GNU_SHA256" "$tmp/deno.zip" | sha256sum --check --status
          unzip -q "$tmp/deno.zip" -d "$tmp"

          canary_ok=false
          for canary_url in \
            'https://www.youtube.com/watch?v=H7HmzwI67ec' \
            'https://www.youtube.com/watch?v=jNQXAC9IVRw'; do
            direct_url="$(timeout --signal=TERM --kill-after=5s 60s \
              "$tmp/yt-dlp" --ignore-config --no-playlist --no-warnings --no-progress \
              --socket-timeout 10 --retries 2 --extractor-retries 2 \
              --js-runtimes "deno:$tmp/deno" \
              --format 'bestaudio[protocol^=http]/bestaudio/best' --skip-download \
              --print '%(url)s' "$canary_url" 2>/dev/null | head -n1)" || true
            [[ "$direct_url" =~ ^https:// ]] || continue
            if curl --fail --silent --show-error --location "${curl_retry[@]}" --remove-on-error \
              --range 0-1023 --max-time 20 --max-filesize 4096 \
              --output "$tmp/canary.bytes" "$direct_url" \
              && [[ -s "$tmp/canary.bytes" ]] \
              && (( $(stat --format=%s "$tmp/canary.bytes") <= 4096 )); then
              canary_ok=true
              break
            fi
          done
          [[ "$canary_ok" == true ]]

          output="$(WOTOHA_YTDLP_PATH="$tmp/yt-dlp" WOTOHA_DENO_PATH="$tmp/deno" \
            cargo run --locked -p wotoha-app --bin track_probe -- \
            https://www.youtube.com/watch?v=H7HmzwI67ec)"
          printf '%s\n' "$output"
          grep -Fq $'PLAYABLE\t0\tok' <<<"$output"
