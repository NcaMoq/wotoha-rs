name: YouTube compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: youtube-compatibility
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test the isolated JavaScript worker
        run: cargo test --locked -p wotoha-youtube-js-worker
      - name: Test the YouTube resolver
        run: cargo test --locked -p wotoha-media
      - name: Verify official EJS golden vectors
        run: cargo test --locked -p wotoha-youtube-js-worker matches_official_ejs_golden_vectors -- --ignored --nocapture
      - name: Verify the current YouTube Player
        run: cargo test --locked -p wotoha-youtube-js-worker solves_current_live_player -- --ignored --nocapture
      - name: Build the isolated JavaScript worker
        run: cargo build --locked -p wotoha-youtube-js-worker --bin wotoha-youtube-js-worker
      - name: Prepare the pinned official EJS oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ejs-reference
          git -C target/ejs-reference init
          git -C target/ejs-reference remote add origin https://github.com/yt-dlp/ejs.git
          git -C target/ejs-reference fetch --depth 1 origin 6f8587bb7009a1fc81038538071d2cb66b8b8ed0
          git -C target/ejs-reference checkout --detach FETCH_HEAD
          npm --prefix target/ejs-reference ci
      - name: Compare the current Player with official EJS
        env:
          WOTOHA_YOUTUBE_JS_WORKER: ${{ github.workspace }}/target/debug/wotoha-youtube-js-worker
          WOTOHA_EJS_RUN: ${{ github.workspace }}/target/ejs-reference/run.ts
        run: node scripts/youtube-differential-canary.mjs
      - name: Verify worker supervision and restart
        env:
          WOTOHA_YOUTUBE_JS_WORKER: ${{ github.workspace }}/target/debug/wotoha-youtube-js-worker
        run: |
          cargo test --locked -p wotoha-media providers::youtube::tests::isolated_javascript_worker_round_trips_and_restarts -- --ignored --exact
          cargo test --locked -p wotoha-media providers::youtube::tests::javascript_worker_hot_swaps_after_atomic_replacement -- --ignored --exact
          cargo test --locked -p wotoha-media providers::youtube::tests::javascript_worker_promotes_content_addressed_candidate -- --ignored --exact
      - name: Probe a current YouTube track end to end
        env:
          WOTOHA_YOUTUBE_JS_WORKER: ${{ github.workspace }}/target/debug/wotoha-youtube-js-worker
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo run --locked -p wotoha-app --bin track_probe -- https://www.youtube.com/watch?v=H7HmzwI67ec)"
          printf '%s\n' "$output"
          grep -Fq $'PLAYABLE\t0\tok' <<<"$output"
