# Licenses accepted for Wotoha's locked Rust dependency graph. cargo-about
# fails the release when a dependency cannot be satisfied by this policy.
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-musl"]
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false
workarounds = ["ring", "rustls", "rustix"]
