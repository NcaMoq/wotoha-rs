name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# This workflow runs only for repository tags. GitHub's cache access rules keep
# tag-triggered runs isolated, so release builds intentionally do not restore or
# save Cargo caches. The privileged publish job runs only after both the test
# and musl build jobs succeed.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Test deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/*.sh deploy/tests/*.sh
          bash deploy/tests/run.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Lint the application and media provider
        run: cargo clippy --locked -p wotoha-app -p wotoha-media --all-targets -- -D warnings

  ubuntu-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-target-musl"
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$RUNNER_TEMP/cargo-target-musl:/cargo-target" \
            --workdir /work \
            --env CARGO_TARGET_DIR=/cargo-target \
            --env WOTOHA_BUILD_VERSION="$GITHUB_REF_NAME" \
            ghcr.io/rust-cross/cargo-zigbuild@sha256:b66e2a5063921aca74fc53248d75d187b7499fe1e076d78eb7d87ab1dbc52f6a \
            bash -c 'rustup toolchain install 1.95.0 --profile minimal --target x86_64-unknown-linux-musl && apt-get update && apt-get install -y --no-install-recommends cmake ninja-build && CMAKE_GENERATOR=Ninja cargo +1.95.0 zigbuild --locked --release --bin wotoha-app --target x86_64-unknown-linux-musl'
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package="dist/wotoha-ubuntu-x86_64-musl"
          mkdir -p "$package/bin" "$package/deploy" "$package/docs" "$package/third-party"
          install -m 0755 "$RUNNER_TEMP/cargo-target-musl/x86_64-unknown-linux-musl/release/wotoha-app" "$package/bin/wotoha-app"
          source deploy/third-party-versions.env
          curl_retry=(--retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 45 --connect-timeout 10)
          case "$YTDLP_REPOSITORY" in yt-dlp/yt-dlp|yt-dlp/yt-dlp-nightly-builds) ;; *) exit 1 ;; esac
          curl -fsSL "${curl_retry[@]}" --max-filesize $((128 * 1024 * 1024)) --remove-on-error "https://github.com/$YTDLP_REPOSITORY/releases/download/$YTDLP_VERSION/yt-dlp_linux" -o "$package/third-party/yt-dlp"
          curl -fsSL "${curl_retry[@]}" --max-filesize $((256 * 1024)) --remove-on-error "https://github.com/$YTDLP_REPOSITORY/releases/download/$YTDLP_VERSION/SHA2-256SUMS" -o "$package/third-party/SHA2-256SUMS"
          curl -fsSL "${curl_retry[@]}" --max-filesize $((64 * 1024)) --remove-on-error "https://github.com/$YTDLP_REPOSITORY/releases/download/$YTDLP_VERSION/SHA2-256SUMS.sig" -o "$package/third-party/SHA2-256SUMS.sig"
          install -d -m 0700 "$RUNNER_TEMP/yt-dlp-gnupg"
          gpg --batch --homedir "$RUNNER_TEMP/yt-dlp-gnupg" --import deploy/yt-dlp-public.key
          test "$(gpg --batch --homedir "$RUNNER_TEMP/yt-dlp-gnupg" --with-colons --fingerprint | awk -F: '$1 == "fpr" {print $10; exit}')" = AC0CBBE6848D6A873464AF4E57CF65933B5A7581
          gpg --batch --homedir "$RUNNER_TEMP/yt-dlp-gnupg" --verify "$package/third-party/SHA2-256SUMS.sig" "$package/third-party/SHA2-256SUMS"
          expected_ytdlp_digest="$(awk '$2 == "yt-dlp_linux" && $1 ~ /^[0-9a-f]{64}$/ {print $1}' "$package/third-party/SHA2-256SUMS")"
          test "$expected_ytdlp_digest" = "$(sha256sum "$package/third-party/yt-dlp" | awk '{print $1}')"
          chmod 0755 "$package/third-party/yt-dlp"
          curl -fsSL "${curl_retry[@]}" --max-filesize $((128 * 1024 * 1024)) --remove-on-error "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip" -o "$package/third-party/deno.zip"
          printf '%s  %s\n' "$DENO_X86_64_LINUX_GNU_SHA256" "$package/third-party/deno.zip" | sha256sum --check --status
          unzip -q "$package/third-party/deno.zip" -d "$package/third-party/deno-unpacked"
          install -m 0755 "$package/third-party/deno-unpacked/deno" "$package/third-party/deno"
          rm -rf "$package/third-party/deno-unpacked" "$package/third-party/deno.zip"
          printf '%s\n' "$GITHUB_REF_NAME" > "$package/RELEASE_VERSION"
          install -m 0755 deploy/install-ubuntu.sh deploy/install-yt-dlp-bundle.sh deploy/wotoha-update.sh deploy/yt-dlp-update.sh "$package/"
          install -m 0644 deploy/wotoha.service deploy/wotoha-update.service deploy/wotoha-update.timer deploy/yt-dlp-update.service deploy/yt-dlp-update.timer deploy/wotoha.env.example deploy/wotoha-update.env.example deploy/yt-dlp-public.key deploy/third-party-versions.env "$package/deploy/"
          install -m 0644 docs/ubuntu-deploy.md docs/youtube-extraction.md "$package/docs/"
          (cd "$package" && sha256sum bin/wotoha-app third-party/yt-dlp third-party/deno > SHA256SUMS.txt)
          (cd "$package" && sha256sum --check SHA256SUMS.txt)
          find "$package" -exec touch -h -d '@0' {} +
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf dist/wotoha-ubuntu-x86_64-musl.tar.gz -C dist wotoha-ubuntu-x86_64-musl
          (cd dist && sha256sum wotoha-ubuntu-x86_64-musl.tar.gz > wotoha-ubuntu-x86_64-musl.tar.gz.sha256)
          digest="$(sha256sum dist/wotoha-ubuntu-x86_64-musl.tar.gz | awk '{print $1}')"
          jq --null-input \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg digest "$digest" \
            '{
              schema_version: 1,
              tag: $tag,
              commit: $commit,
              asset: "wotoha-ubuntu-x86_64-musl.tar.gz",
              sha256: $digest
            }' > dist/wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json
      - name: Upload verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-x86_64-release-inputs
          path: |
            dist/wotoha-ubuntu-x86_64-musl.tar.gz
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.sha256
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [test, ubuntu-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ubuntu-x86_64-release-inputs
          path: dist
      - name: Verify downloaded release inputs
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive=wotoha-ubuntu-x86_64-musl.tar.gz
          sha256sum --check "$archive.sha256"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          jq --exit-status \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg digest "$digest" \
            '.schema_version == 1
             and .tag == $tag
             and .commit == $commit
             and .asset == "wotoha-ubuntu-x86_64-musl.tar.gz"
             and .sha256 == $digest' \
            "$archive.manifest.json" >/dev/null
      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-ubuntu-x86_64-musl.tar.gz
      - name: Attest release manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json
      - name: Download archive attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          download_bundle() {
            local subject="$1"
            local destination="$2"
            rm -f sha256*.jsonl
            for attempt in 1 2 3 4 5; do
              if gh attestation download "$subject" --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              (( attempt < 5 ))
              sleep $((attempt * 2))
            done
            local bundle
            bundle="$(find . -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)"
            test -n "$bundle"
            mv "$bundle" "$destination"
          }
          download_bundle wotoha-ubuntu-x86_64-musl.tar.gz archive.jsonl
          download_bundle wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json manifest.jsonl
          cat archive.jsonl manifest.jsonl \
            > wotoha-ubuntu-x86_64-musl.tar.gz.attestation.jsonl
          rm -f archive.jsonl manifest.jsonl
      - name: Verify archive attestation policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive=dist/wotoha-ubuntu-x86_64-musl.tar.gz
          bundle="$archive.attestation.jsonl"
          gh attestation verify "$archive" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify "$archive.manifest.json" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners >/dev/null
          cp "$archive" "$archive.tampered"
          printf x >> "$archive.tampered"
          if gh attestation verify "$archive.tampered" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tampered release archive passed attestation verification" >&2
            exit 1
          fi
          rm -f "$archive.tampered"
          cp "$archive.manifest.json" "$archive.manifest.json.tampered"
          printf x >> "$archive.manifest.json.tampered"
          if gh attestation verify "$archive.manifest.json.tampered" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tampered release manifest passed attestation verification" >&2
            exit 1
          fi
          rm -f "$archive.manifest.json.tampered"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.sha256 \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.manifest.json \
            dist/wotoha-ubuntu-x86_64-musl.tar.gz.attestation.jsonl \
            --verify-tag \
            --draft \
            --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
