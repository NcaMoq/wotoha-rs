name: container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ncamoq/wotoha-rs

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            IMAGE_VERSION=${{ github.ref_name }}

      - name: Smoke test offline self-check
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,exec,mode=1777 \
            --mount type=tmpfs,destination=/data,tmpfs-mode=0777 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            "$image" --self-check
          docker run --rm --entrypoint /bin/sh "$image" -c '
            set -eu
            test ! -e /usr/local/cargo
            test ! -e /src
            test ! -e /app/target
            test -x /app/wotoha-app
            test -x /app/tools/yt-dlp-fallback
            test -x /app/tools/deno
          '

      - name: Push immutable image tags
        if: github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            docker push "$image"
          done <<< "$IMAGE_TAGS"
