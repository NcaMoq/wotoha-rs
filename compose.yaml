services:
  wotoha:
    image: ${WOTOHA_IMAGE_REF:-ghcr.io/ncamoq/wotoha-rs:${WOTOHA_IMAGE_TAG:?set WOTOHA_IMAGE_REF or WOTOHA_IMAGE_TAG}}
    restart: unless-stopped
    env_file:
      - path: ./runtime.env
        required: false
    environment:
      WOTOHA_RECONNECT_STATE_FILE: /wotoha/reconnect.json
      WOTOHA_ANALYSIS_CACHE_DIR: /wotoha/cache/analysis
      WOTOHA_LOG_DIR: /wotoha/logs
      WOTOHA_LOG_FILE_ENABLED: ${WOTOHA_LOG_FILE_ENABLED:-false}
      WOTOHA_DENO_PATH: /app/tools/deno
    volumes:
      - ${WOTOHA_DATA_DIR:-./data}:/wotoha
    read_only: true
    tmpfs:
      - /tmp:rw,exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
