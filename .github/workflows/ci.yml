name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify workspace package licensing
        run: |
          cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          workspace_members = set(metadata["workspace_members"])
          unlicensed = [
              package["name"]
              for package in metadata["packages"]
              if package["id"] in workspace_members and not package.get("license")
          ]
          if unlicensed:
              raise SystemExit(
                  "Workspace packages without a license: " + ", ".join(unlicensed)
              )
          '
      - name: Test deployment updater safety
        run: |
          bash -n deploy/*.sh deploy/tests/*.sh
          bash deploy/tests/run.sh
      - name: Check the workspace
        run: cargo check --workspace --locked
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings
